name: Build Edge0 145B CUDA image

on:
  push:
    paths:
      - "docker/edge0/**"
      - ".github/workflows/build-edge0-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker/edge0
          file: docker/edge0/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/edge0-145b:latest
            ghcr.io/${{ github.repository_owner }}/edge0-145b:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
